name: Deploy AWS S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-s3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: aws-s3
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      NEXT_PUBLIC_FOCUS_LIST_ACCOUNT_API_URL: ${{ vars.NEXT_PUBLIC_FOCUS_LIST_ACCOUNT_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build static site for S3
        run: yarn build:aws

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate AWS deploy settings
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_S3_BUCKET"

      - name: Configure S3 static website
        run: aws s3 website "s3://$AWS_S3_BUCKET" --index-document index.html --error-document 404.html

      - name: Sync static export to S3
        run: aws s3 sync out "s3://$AWS_S3_BUCKET" --cache-control "public,max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
            --region us-east-1 \
            --stack-name focus-list-cloudfront-https \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)"
          test -n "$DISTRIBUTION_ID"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
