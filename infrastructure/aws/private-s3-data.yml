AWSTemplateFormatVersion: "2010-09-09"
Description: Private per-user S3 state API for Focus List.

Parameters:
  DataBucketName:
    Type: String
    Description: Globally unique private bucket name for Focus List user data.
    Default: focus-list-private-data-990723918097-ap-southeast-1
  AllowedOrigin:
    Type: String
    Description: Exact public website origin allowed to call the data API.
    Default: http://focus-list.abhijeetanand.com-990723918097-ap-southeast-1-an.s3-website-ap-southeast-1.amazonaws.com
  SupabaseUrl:
    Type: String
    Description: Existing Supabase project URL used only to validate user sessions.
  SupabasePublishableKey:
    Type: String
    NoEcho: true
    Description: Existing Supabase publishable key used to validate user sessions.
  MaxStateBytes:
    Type: Number
    Default: 1048576
    MinValue: 1024
    MaxValue: 5242880
    Description: Maximum JSON state size accepted for one user.

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref DataBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: FocusList
        - Key: DataClassification
          Value: PrivateUserData

  DataApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FocusListPrivateDataAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/users/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*

  DataApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Authenticated read and write access to private Focus List S3 state.
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      Timeout: 20
      Role: !GetAtt DataApiRole.Arn
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          MAX_STATE_BYTES: !Ref MaxStateBytes
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_PUBLISHABLE_KEY: !Ref SupabasePublishableKey
      Code:
        ZipFile: |
          const {
            GetObjectCommand,
            PutObjectCommand,
            S3Client,
          } = require("@aws-sdk/client-s3");

          const s3 = new S3Client({});
          const bucket = process.env.DATA_BUCKET;
          const maxStateBytes = Number(process.env.MAX_STATE_BYTES);
          const supabaseUrl = process.env.SUPABASE_URL.replace(/\/$/, "");
          const supabaseKey = process.env.SUPABASE_PUBLISHABLE_KEY;

          function reply(statusCode, body, headers = {}) {
            return {
              statusCode,
              headers: {
                "cache-control": "no-store",
                "content-type": "application/json",
                ...headers,
              },
              body: body === undefined ? "" : JSON.stringify(body),
            };
          }

          function bearerToken(headers = {}) {
            const value = headers.authorization || headers.Authorization || "";
            const match = value.match(/^Bearer\s+(.+)$/i);
            return match ? match[1] : null;
          }

          async function authenticatedUser(headers) {
            const token = bearerToken(headers);
            if (!token) return null;

            const response = await fetch(`${supabaseUrl}/auth/v1/user`, {
              headers: {
                apikey: supabaseKey,
                authorization: `Bearer ${token}`,
              },
            });

            if (!response.ok) return null;
            const user = await response.json();
            return typeof user.id === "string" && user.id ? user : null;
          }

          function emptyState() {
            return {
              schemaVersion: 1,
              projects: [],
              tags: [],
              tasks: [],
              notes: [],
              reminders: [],
              updatedAt: null,
            };
          }

          function validState(value) {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
              return false;
            }

            return ["projects", "tags", "tasks", "notes", "reminders"]
              .every((field) => Array.isArray(value[field]));
          }

          exports.handler = async (event) => {
            const method = event.requestContext?.http?.method || "";
            const path = event.rawPath || "/";

            if (method === "OPTIONS") {
              return { statusCode: 204, body: "" };
            }

            if (method === "GET" && path === "/health") {
              return reply(200, { status: "ok" });
            }

            if (path !== "/state" || !["GET", "PUT"].includes(method)) {
              return reply(404, { error: "Not found" });
            }

            const user = await authenticatedUser(event.headers);
            if (!user) {
              return reply(401, { error: "A valid login session is required" });
            }

            const key = `users/${user.id}/state.json`;

            if (method === "GET") {
              try {
                const result = await s3.send(new GetObjectCommand({
                  Bucket: bucket,
                  Key: key,
                }));
                const state = JSON.parse(await result.Body.transformToString());
                return reply(200, state, { etag: result.ETag || "" });
              } catch (error) {
                if (error.name === "NoSuchKey" || error.$metadata?.httpStatusCode === 404) {
                  return reply(200, emptyState());
                }
                console.error("Unable to read user state", error);
                return reply(500, { error: "Unable to read user data" });
              }
            }

            const encodedBody = event.body || "";
            const rawBody = event.isBase64Encoded
              ? Buffer.from(encodedBody, "base64").toString("utf8")
              : encodedBody;

            if (Buffer.byteLength(rawBody, "utf8") > maxStateBytes) {
              return reply(413, { error: "User data is too large" });
            }

            let input;
            try {
              input = JSON.parse(rawBody);
            } catch {
              return reply(400, { error: "Request body must be valid JSON" });
            }

            if (!validState(input)) {
              return reply(400, {
                error: "State must include projects, tags, tasks, notes, and reminders arrays",
              });
            }

            const state = {
              schemaVersion: 1,
              projects: input.projects,
              tags: input.tags,
              tasks: input.tasks,
              notes: input.notes,
              reminders: input.reminders,
              updatedAt: new Date().toISOString(),
            };
            const ifMatch = event.headers?.["if-match"] || event.headers?.["If-Match"];

            try {
              const result = await s3.send(new PutObjectCommand({
                Bucket: bucket,
                Key: key,
                Body: JSON.stringify(state),
                ContentType: "application/json",
                ServerSideEncryption: "AES256",
                ...(ifMatch ? { IfMatch: ifMatch } : {}),
              }));
              return reply(200, state, { etag: result.ETag || "" });
            } catch (error) {
              if (error.$metadata?.httpStatusCode === 412) {
                return reply(409, { error: "User data changed on another device" });
              }
              console.error("Unable to write user state", error);
              return reply(500, { error: "Unable to save user data" });
            }
          };

  DataApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: FocusListPrivateDataApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - authorization
          - content-type
          - if-match
        AllowMethods:
          - GET
          - PUT
          - OPTIONS
        AllowOrigins:
          - !Ref AllowedOrigin
        ExposeHeaders:
          - etag
        MaxAge: 300

  DataApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DataApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DataApiFunction.Arn
      PayloadFormatVersion: "2.0"

  DataApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DataApi
      RouteKey: $default
      Target: !Sub integrations/${DataApiIntegration}

  DataApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DataApi
      StageName: $default
      AutoDeploy: true

  DataApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DataApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${DataApi}/*

Outputs:
  DataBucketName:
    Description: Private S3 bucket containing per-user state objects.
    Value: !Ref DataBucket
  DataApiUrl:
    Description: HTTPS API URL to set as NEXT_PUBLIC_FOCUS_LIST_DATA_API_URL.
    Value: !Sub https://${DataApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  HealthCheckUrl:
    Description: Public health endpoint for deployment verification.
    Value: !Sub https://${DataApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health
